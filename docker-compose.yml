services:
  # ── Next.js Application Service ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailgenius-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mailgenius-net
    volumes:
      - app-logs:/app/logs

  # ── Redis (Caching & Rate Limiting) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mailgenius-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - mailgenius-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mailgenius-net:
    driver: bridge

volumes:
  redis-data:
  app-logs:
